name: Check Sovereign agent

on:
  pull_request:
    paths:
      - 'sovereign/**'
      - '.github/workflows/sovereign-discussion.yml'
      - '.github/workflows/sovereign-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python
        run: python3 -m compileall -q sovereign
      - name: Run unit tests
        run: python3 -m unittest discover -s sovereign/tests -v
